 · big again (matches Design intent) */\n  .contrals-page span[style*=\"letter-spacing: -0.03em\"] {\n    font-size: clamp(72px, 10vw, 168px) !important;\n    line-height: 0.92 !important;\n  }\n  /* Stats grid: stays 4-col (full width of the wider text column) */\n  .contrals-page > div > section:first-of-type > div:first-child > div:last-child {\n    grid-template-columns: repeat(4, 1fr) !important;\n  }\n  /* Force fr ratio to be respected (override min-content) */\n  .contrals-page > div > section:first-of-type > div {\n    min-width: 0 !important;\n  }\n  .contrals-page > div > section:first-of-type > div:first-child p {\n    max-width: none !important;\n    font-size: 15px !important;\n  }\n}\n\n/* ===== Tablet-large (≤1279px) · compress padding ===== */\n@media (max-width: 1279px) {\n  .contrals-page nav { padding: 12px 32px !important; }\n  .contrals-page section { padding-left: 32px !important; padding-right: 32px !important; }\n}\n\n/* ===== Tablet (≤1023px) · stack hero, photo grid below at full width ===== */\n@media (max-width: 1023px) {\n  .contrals-page > div > section:first-of-type {\n    grid-template-columns: 1fr !important;\n    gap: 40px !important;\n    padding: 40px 24px !important;\n  }\n  .contrals-page > div > section:first-of-type > div:last-child {\n    min-height: 0 !important;\n    height: auto !important;\n  }\n  .contrals-page > div > section:first-of-type > div:last-child > div {\n    height: auto !important;\n    aspect-ratio: auto !important;\n  }\n  .contrals-page > div > section:first-of-type > div:last-child > div > div {\n    aspect-ratio: 1 / 1 !important;\n  }\n  \n  /* Nav: hide center link list */\n  .contrals-page nav > div:nth-child(2) { display: none !important; }\n  .contrals-page nav { padding: 10px 24px !important; }\n  \n  .contrals-page section { padding: 40px 24px !important; }\n  \n  /* Hero stats: 2-col */\n  .contrals-page > div > section:first-of-type > div:first-child > div:last-child {\n    grid-template-columns: repeat(2, 1fr) !important;\n  }\n  \n  /* PlatformMatrix 3-card row → stack */\n  .contrals-page > div > section:nth-of-type(2) > div:last-child { \n    grid-template-columns: 1fr !important; \n  }\n  \n  /* Wordmark scaling */\n  .contrals-page span[style*=\"letter-spacing: -0.03em\"] {\n    font-size: clamp(56px, 12vw, 128px) !important;\n  }\n  \n  /* Section titles */\n  .contrals-page section h2 { font-size: clamp(24px, 4vw, 36px) !important; line-height: 1.15 !important; }\n}\n\n/* ===== Mobile (≤767px) ===== */\n@media (max-width: 767px) {\n  .contrals-page nav > div:last-child > button:not(:first-child) { display: none !important; }\n  .contrals-page nav { padding: 8px 16px !important; }\n  .contrals-page nav img { width: 80px !important; }\n  \n  .contrals-page section { padding: 32px 16px !important; }\n  .contrals-page > div > section:first-of-type { padding: 24px 16px 32px !important; }\n  \n  .contrals-page span[style*=\"letter-spacing: -0.03em\"] {\n    font-size: clamp(40px, 16vw, 80px) !important;\n  }\n  \n  .contrals-page > div > section:first-of-type span[style*=\"letter-spacing\"] {\n    white-space: normal !important;\n  }\n  \n  /* Hero stats: 1-col on phones */\n  .contrals-page > div > section:first-of-type > div:first-child > div:last-child {\n    grid-template-columns: 1fr !important;\n  }\n  \n  /* Hero photo grid: 3×3 → 2×n */\n  .contrals-page > div > section:first-of-type > div:last-child > div { \n    grid-template-columns: repeat(2, 1fr) !important;\n    grid-template-rows: auto !important;\n    height: auto !important;\n  }\n  \n  /* SKU browser table horizontal scroll */\n  .contrals-page section [style*=\"grid-template-columns: 28px\"] {\n    min-width: 720px !important;\n  }\n  \n  .contrals-page section p { font-size: 14px !important; }\n  \n  /* BOM drawer */\n  .contrals-page > div > div[style*=\"position: fixed\"] {\n    left: 0 !important; right: 0 !important; width: 100% !important; border-radius: 0 !important;\n  }\n}\n
